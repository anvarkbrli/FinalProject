<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/wellplayd-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      (() => {
        const storageKey = "wellplayd-theme";
        const savedTheme = window.localStorage.getItem(storageKey);
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : "dark";

        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>WellPlayd</title>

    <style>
      :root {
        --wp-loader-bg-dark-1: #0b1020;
        --wp-loader-bg-dark-2: #101a33;
        --wp-loader-surface-dark: rgba(20, 29, 51, 0.82);
        --wp-loader-border-dark: rgba(129, 146, 187, 0.18);
        --wp-loader-text-dark: #f5f7ff;
        --wp-loader-subtle-dark: #9baccc;
        --wp-loader-bg-light-1: #eef3ff;
        --wp-loader-bg-light-2: #f7f9ff;
        --wp-loader-surface-light: rgba(255, 255, 255, 0.86);
        --wp-loader-border-light: rgba(116, 134, 176, 0.16);
        --wp-loader-text-light: #16213c;
        --wp-loader-subtle-light: #68789d;
        --wp-loader-accent-1: #7c4dff;
        --wp-loader-accent-2: #37d6ff;
        --wp-loader-accent-3: #37e6a8;
      }

      html, body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 15% 18%, rgba(124, 77, 255, 0.22), transparent 28%),
          radial-gradient(circle at 82% 24%, rgba(55, 214, 255, 0.16), transparent 22%),
          linear-gradient(115deg, var(--wp-loader-bg-dark-1), var(--wp-loader-bg-dark-2) 58%, #122033);
      }

      html[data-theme="light"] body {
        background:
          radial-gradient(circle at 15% 18%, rgba(124, 77, 255, 0.12), transparent 30%),
          radial-gradient(circle at 82% 24%, rgba(55, 214, 255, 0.10), transparent 24%),
          linear-gradient(115deg, var(--wp-loader-bg-light-1), var(--wp-loader-bg-light-2) 55%, #edf5ff);
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
        transition: opacity 320ms ease, visibility 320ms ease;
        background:
          radial-gradient(circle at 50% 50%, rgba(124, 77, 255, 0.10), transparent 46%),
          linear-gradient(115deg, var(--wp-loader-bg-dark-1), var(--wp-loader-bg-dark-2) 58%, #122033);
      }

      html[data-theme="light"] #boot-loader {
        background:
          radial-gradient(circle at 50% 50%, rgba(124, 77, 255, 0.08), transparent 48%),
          linear-gradient(115deg, var(--wp-loader-bg-light-1), var(--wp-loader-bg-light-2) 55%, #edf5ff);
      }

      #boot-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader__grid {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        background-image:
          linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.18) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: linear-gradient(to bottom, rgba(0,0,0,0.72), transparent);
      }

      html[data-theme="light"] .boot-loader__grid {
        opacity: 0.08;
      }

      .boot-loader__orb,
      .boot-loader__orb::after {
        position: absolute;
        border-radius: 50%;
        filter: blur(14px);
      }

      .boot-loader__orb {
        width: 280px;
        height: 280px;
        background: rgba(124, 77, 255, 0.22);
        left: 10%;
        top: 16%;
        animation: loaderFloat 8s ease-in-out infinite;
      }

      .boot-loader__orb::after {
        content: "";
        width: 190px;
        height: 190px;
        background: rgba(55, 214, 255, 0.18);
        right: -180%;
        top: 62%;
        animation: loaderFloat 7s ease-in-out infinite reverse;
      }

      .boot-loader__card {
        position: relative;
        width: min(460px, 100%);
        border-radius: 28px;
        padding: 32px 28px 26px;
        border: 1px solid var(--wp-loader-border-dark);
        background: var(--wp-loader-surface-dark);
        box-shadow:
          0 24px 90px rgba(3, 8, 22, 0.42),
          inset 0 1px 0 rgba(255,255,255,0.06);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      html[data-theme="light"] .boot-loader__card {
        background: var(--wp-loader-surface-light);
        border-color: var(--wp-loader-border-light);
        box-shadow:
          0 24px 60px rgba(92, 116, 170, 0.16),
          inset 0 1px 0 rgba(255,255,255,0.62);
      }

      .boot-loader__badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .boot-loader__logo-wrap {
        position: relative;
        width: 74px;
        height: 74px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(124, 77, 255, 0.20), rgba(55, 214, 255, 0.16));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
      }

      .boot-loader__logo-wrap::before,
      .boot-loader__logo-wrap::after {
        content: "";
        position: absolute;
        inset: -8px;
        border-radius: 28px;
        border: 1px solid rgba(124, 77, 255, 0.18);
        animation: loaderPulse 2.8s ease-out infinite;
      }

      .boot-loader__logo-wrap::after {
        inset: -16px;
        animation-delay: 1.15s;
      }

      .boot-loader__logo {
        width: 44px;
        height: 44px;
        object-fit: contain;
        filter: drop-shadow(0 8px 20px rgba(70, 189, 255, 0.22));
      }

      .boot-loader__eyebrow {
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        margin: 0 0 10px;
        color: #9e84ff;
      }

      html[data-theme="light"] .boot-loader__eyebrow {
        color: #7650ff;
      }

      .boot-loader__title {
        margin: 0;
        font-size: clamp(32px, 5vw, 42px);
        line-height: 1.05;
        font-weight: 800;
        color: var(--wp-loader-text-dark);
        letter-spacing: -0.03em;
      }

      html[data-theme="light"] .boot-loader__title {
        color: var(--wp-loader-text-light);
      }

      .boot-loader__subtitle {
        margin: 14px 0 0;
        font-size: 15px;
        line-height: 1.7;
        color: var(--wp-loader-subtle-dark);
      }

      html[data-theme="light"] .boot-loader__subtitle {
        color: var(--wp-loader-subtle-light);
      }

      .boot-loader__progress {
        position: relative;
        overflow: hidden;
        height: 10px;
        margin-top: 28px;
        border-radius: 999px;
        background: rgba(255,255,255,0.08);
      }

      html[data-theme="light"] .boot-loader__progress {
        background: rgba(115, 136, 183, 0.15);
      }

      .boot-loader__progress::before {
        content: "";
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--wp-loader-accent-1), var(--wp-loader-accent-2), var(--wp-loader-accent-3));
        background-size: 200% 100%;
        animation: loaderSlide 1.6s ease-in-out infinite, loaderShimmer 2.6s linear infinite;
        box-shadow: 0 0 24px rgba(124, 77, 255, 0.28);
      }

      .boot-loader__footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
      }

      .boot-loader__status,
      .boot-loader__hint {
        font-size: 14px;
        color: var(--wp-loader-subtle-dark);
      }

      html[data-theme="light"] .boot-loader__status,
      html[data-theme="light"] .boot-loader__hint {
        color: var(--wp-loader-subtle-light);
      }

      .boot-loader__status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .boot-loader__status::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--wp-loader-accent-2), var(--wp-loader-accent-3));
        box-shadow: 0 0 0 0 rgba(55, 230, 168, 0.42);
        animation: loaderDot 2s ease-out infinite;
      }

      .boot-loader__hint {
        opacity: 0.92;
        white-space: nowrap;
      }

      @keyframes loaderPulse {
        0% { transform: scale(0.92); opacity: 0; }
        30% { opacity: 0.34; }
        100% { transform: scale(1.14); opacity: 0; }
      }

      @keyframes loaderSlide {
        0% { transform: translateX(-8%); }
        50% { transform: translateX(135%); }
        100% { transform: translateX(-8%); }
      }

      @keyframes loaderShimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }

      @keyframes loaderDot {
        0% { box-shadow: 0 0 0 0 rgba(55, 230, 168, 0.45); }
        70% { box-shadow: 0 0 0 10px rgba(55, 230, 168, 0); }
        100% { box-shadow: 0 0 0 0 rgba(55, 230, 168, 0); }
      }

      @keyframes loaderFloat {
        0%, 100% { transform: translate3d(0, 0, 0); }
        50% { transform: translate3d(0, 18px, 0); }
      }

      @media (max-width: 640px) {
        .boot-loader__card {
          border-radius: 24px;
          padding: 24px 20px 20px;
        }

        .boot-loader__footer {
          flex-direction: column;
          align-items: flex-start;
        }

        .boot-loader__hint {
          white-space: normal;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loader__orb,
        .boot-loader__orb::after,
        .boot-loader__logo-wrap::before,
        .boot-loader__logo-wrap::after,
        .boot-loader__progress::before,
        .boot-loader__status::before {
          animation: none !important;
        }
      }
    </style>

  </head>
  <body>

    <div id="boot-loader" aria-live="polite" aria-label="WellPlayd loading screen">
      <div class="boot-loader__grid" aria-hidden="true"></div>
      <div class="boot-loader__orb" aria-hidden="true"></div>
      <div class="boot-loader__card" role="status">
        <div class="boot-loader__badge">
          <div class="boot-loader__logo-wrap" aria-hidden="true">
            <img class="boot-loader__logo" src="/wellplayd-logo.png" alt="" />
          </div>
        </div>
        <p class="boot-loader__eyebrow">WellPlayd</p>
        <h1 class="boot-loader__title">Play. Track. Discuss.</h1>
        <p class="boot-loader__subtitle">Platforma hazırlanır — oyun dünyasına daxil olursan.</p>
        <div class="boot-loader__progress" aria-hidden="true"></div>
        <div class="boot-loader__footer">
          <span class="boot-loader__status">Yüklənir</span>
          <span class="boot-loader__hint">Sənin oyun təcrübən hazırlanır...</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (() => {
        const hideLoader = () => {
          const loader = document.getElementById('boot-loader');
          if (!loader || loader.classList.contains('is-hidden')) return;
          loader.classList.add('is-hidden');
          window.setTimeout(() => loader.remove(), 360);
        };

        const root = document.getElementById('root');
        if (root) {
          const observer = new MutationObserver(() => {
            if (root.childNodes.length > 0) {
              hideLoader();
              observer.disconnect();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        }

        window.addEventListener('load', () => {
          window.setTimeout(hideLoader, 300);
        }, { once: true });

        window.setTimeout(hideLoader, 5000);
      })();
    </script>
  </body>
</html>
