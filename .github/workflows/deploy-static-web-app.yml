name: Deploy WellPlayd Frontend

on:
  push:
    branches:
      - main
    paths:
      - "presentation/Frontend/ludora-client/**"
      - ".github/workflows/deploy-static-web-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: presentation/Frontend/ludora-client/package-lock.json

      - name: Install dependencies
        working-directory: presentation/Frontend/ludora-client
        run: npm ci

      - name: Build frontend
        working-directory: presentation/Frontend/ludora-client
        env:
          VITE_API_BASE_URL: https://api.wellplayd.forum/api
          VITE_API_ORIGIN: https://api.wellplayd.forum
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: presentation/Frontend/ludora-client/dist
          skip_app_build: true
          output_location: ""