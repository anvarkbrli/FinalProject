name: Deploy WellPlayd Frontend

on:
  push:
    branches:
      - main
    paths:
      - "presentation/Frontend/ludora-client/**"
      - ".github/workflows/azure-static-web-apps-green-wave-0cf533310.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wellplayd-frontend-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy production frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: https://wellplayd-fqdhcqg2gffrcndq.israelcentral-01.azurewebsites.net/api
      VITE_API_ORIGIN: https://wellplayd-fqdhcqg2gffrcndq.israelcentral-01.azurewebsites.net

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: presentation/Frontend/ludora-client/package-lock.json

      - name: Install dependencies
        working-directory: presentation/Frontend/ludora-client
        run: npm ci

      - name: Build production frontend
        working-directory: presentation/Frontend/ludora-client
        run: npm run build

      - name: Verify deploy bundle
        working-directory: presentation/Frontend/ludora-client
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f dist/index.html
          test -f dist/staticwebapp.config.json
          grep -R -Fq "$VITE_API_BASE_URL" dist/assets

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_WAVE_0CF533310 }}
          action: upload
          app_location: presentation/Frontend/ludora-client/dist
          skip_app_build: true
          output_location: ""
