# Replace domains and certificate paths. This file belongs on the external TLS proxy,
# not inside the frontend container.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name api.wellplayd.example;

    ssl_certificate     /etc/letsencrypt/live/api.wellplayd.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.wellplayd.example/privkey.pem;

    client_max_body_size 220m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

server {
    listen 443 ssl http2;
    server_name wellplayd.example;

    ssl_certificate     /etc/letsencrypt/live/wellplayd.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wellplayd.example/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name api.wellplayd.example wellplayd.example;
    return 301 https://$host$request_uri;
}
